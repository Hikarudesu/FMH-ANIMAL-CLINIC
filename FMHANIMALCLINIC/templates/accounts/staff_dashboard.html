{% extends 'base/portal_admin.html' %}

{% block title %}Staff Dashboard{% endblock %}

{% block content %}
<div class="page-hero">
  <div class="page-hero-inner">
    <div class="page-hero-text">
      <h1><i class='bx bx-grid-alt'></i> Staff Dashboard</h1>
      <p>{{ role_name }}{% if branch %} · {{ branch.name }}{% endif %}</p>
    </div>
  </div>
</div>

<div class="dashboard-grid" style="margin-top: 20px;">
  <section class="dashboard-card">
    <div class="card-header"><h3><i class='bx bxs-dog'></i> Active Patients</h3></div>
    <div class="card-body"><strong>{{ active_patient_count }}</strong></div>
  </section>
  <section class="dashboard-card">
    <div class="card-header"><h3><i class='bx bx-calendar-check'></i> Today's Appointments</h3></div>
    <div class="card-body"><strong>{{ today_appointment_count }}</strong></div>
  </section>
</div>
{% endblock %}
