<div class="modal-overlay" id="petDeleteModal" aria-hidden="true">
  <div class="modal-content" role="alertdialog" aria-modal="true" aria-labelledby="petDeleteTitle" aria-describedby="petDeleteMessage" tabindex="-1" style="max-width: 480px;">
    <div class="modal-header">
      <h3 id="petDeleteTitle" style="color: var(--accent);"><i class="bx bx-error-circle"></i> Archive Patient</h3>
      <button class="modal-close" type="button" aria-label="Close" data-pet-delete-close>&times;</button>
    </div>
    <form id="petDeleteForm" method="post">
      {% csrf_token %}
      <div class="modal-body" style="text-align: center; padding-top: 30px;">
        <i class="bx bx-info-circle" style="font-size: 4rem; color: var(--accent); margin-bottom: 16px;"></i>
        <h4 style="margin-bottom: 12px; font-size: 1.25rem;">Move <span id="petDeleteName"></span> to Archive?</h4>
        <p id="petDeleteMessage" style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-bottom: 10px;">
          This pet and its medical history will be kept in the Archive for 30 days, then permanently deleted.
        </p>
      </div>
      <div class="modal-footer" style="justify-content: flex-end; gap: 12px;">
        <button type="button" class="btn-cancel" data-pet-delete-close>Cancel</button>
        <button type="submit" class="btn-submit">Move to Archive</button>
      </div>
    </form>
  </div>
</div>

<style>
  button.pet-delete-trigger { font: inherit; cursor: pointer; }
  .modal-footer .btn-cancel, .modal-footer .btn-submit {
    display:inline-flex !important;
    align-items:center !important;
    gap:6px !important;
    padding:8px 16px !important;
    border-radius:var(--radius-sm, 6px) !important;
    font-size:.85rem !important;
    font-weight:600 !important;
    cursor:pointer !important;
    transition:all .2s cubic-bezier(.4, 0, .2, 1) !important;
    text-decoration:none !important;
  }
  .modal-footer .btn-cancel {
    border:1px solid var(--border) !important;
    background:var(--surface) !important;
    color:var(--text-1) !important;
  }
  .modal-footer .btn-cancel:hover { border-color:var(--border-hover) !important; background:var(--bg) !important; }
  .modal-footer .btn-submit {
    border:1px solid var(--accent) !important;
    background:var(--accent) !important;
    color:#fff !important;
    box-shadow:0 4px 12px rgba(230, 57, 70, .25) !important;
  }
  .modal-footer .btn-submit:hover { opacity:.95 !important; transform:translateY(-1px) !important; box-shadow:0 6px 16px rgba(230, 57, 70, .35) !important; }
</style>

<script>
(() => {
  const overlay = document.getElementById('petDeleteModal');
  if (!overlay) return;

  const dialog = overlay.querySelector('.modal-content');
  const form = document.getElementById('petDeleteForm');
  const name = document.getElementById('petDeleteName');
  let previousTrigger = null;

  function closeModal() {
    overlay.classList.remove('active');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    previousTrigger?.focus();
  }

  document.querySelectorAll('[data-delete-url][data-pet-name]').forEach(trigger => {
    trigger.addEventListener('click', () => {
      previousTrigger = trigger;
      form.action = trigger.dataset.deleteUrl;
      name.textContent = trigger.dataset.petName;
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      dialog.focus();
    });
  });

  overlay.querySelectorAll('[data-pet-delete-close]').forEach(button => {
    button.addEventListener('click', closeModal);
  });
  overlay.addEventListener('click', event => {
    if (event.target === overlay) closeModal();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && overlay.classList.contains('active')) closeModal();
  });
})();
</script>
