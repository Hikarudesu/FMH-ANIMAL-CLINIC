{% if page_obj.has_other_pages %}
<nav class="portal-appointment-pagination" aria-label="{{ tab_name|title }} appointment pages">
  {% if page_obj.has_previous %}
  <a href="?tab={{ tab_name }}&{{ tab_name }}_page={{ page_obj.previous_page_number }}" aria-label="Previous page"><i class='bx bx-chevron-left'></i> Previous</a>
  {% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?tab={{ tab_name }}&{{ tab_name }}_page={{ page_obj.next_page_number }}" aria-label="Next page">Next <i class='bx bx-chevron-right'></i></a>
  {% endif %}
</nav>
{% endif %}
